<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoZ3 &middot; Workflows Graph</title>

  <!--
    msagl-js loads from esm.sh so @msagl/core stays a single shared instance
    across the parser and the SVG renderer (bundling would create two cores and
    break attribute/layout state). esm.sh, however, mis-wraps panzoom's CommonJS
    dependencies (its eventify() loses .fire), so we externalize panzoom from the
    renderer build (?external=panzoom emits a bare `import ... from "panzoom"`)
    and resolve that bare specifier through this import map to jsDelivr's
    Rollup-bundled ESM build, which keeps the CJS interop intact.
  -->
  <script type="importmap">
    {
      "imports": {
        "panzoom": "https://cdn.jsdelivr.net/npm/panzoom@9.4.4/+esm"
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: #1e2128;
      background: #fffdf8;
    }

    #bar {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding: 8px 14px;
      border-bottom: 1px solid #d8d2c7;
      background: #f0ebe1;
      font-size: 0.82rem;
    }

    #bar strong { font-size: 0.92rem; color: #1c3856; }

    .legend { display: inline-flex; align-items: center; gap: 6px; color: #5e6673; }
    .swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #999; }
    .ln { display: inline-block; width: 22px; border-top: 2px solid #444; }
    .ln.dashed { border-top-style: dashed; }

    #viewer {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      margin-top: 0;
      touch-action: none;
      overflow: hidden;
    }

    #wrap { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }
    #viewer-host { position: relative; flex: 1; min-height: 0; }

    #status {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #5e6673;
      font-size: 0.95rem;
      text-align: center;
      max-width: 80%;
    }

    #status.error { color: #c0392b; }
  </style>
</head>

<body>
  <div id="wrap">
    <div id="bar">
      <strong>Z3Prover/bench &middot; workflow dependency graph</strong>
      <span class="legend"><span class="ln"></span> workflow_run (auto)</span>
      <span class="legend"><span class="ln dashed"></span> explicit dispatch</span>
      <span class="legend"><span class="swatch" style="background:#eef3fb"></span> manual</span>
      <span class="legend"><span class="swatch" style="background:#fff2cc"></span> scheduled</span>
      <span class="legend"><span class="swatch" style="background:#e6f4ea"></span> push</span>
      <span class="legend"><span class="swatch" style="background:#f3e8fd"></span> agentic workflow (.lock.yml)</span>
      <span class="legend" style="color:#999">scroll to zoom &middot; drag to pan</span>
    </div>
    <div id="viewer-host">
      <div id="viewer"></div>
      <div id="status">Loading msagl-js&hellip;</div>
    </div>
  </div>

  <!--
    Dependency graph rendered with msagl-js (https://microsoft.github.io/msagljs/).
    The DOT source below mirrors .github/workflows/workflows-graph.dot. Keep the
    two in sync when workflow triggers change.

    Edge style:  solid = "workflow_run: completed" (event-driven, automatic)
                 dashed = explicit dispatch (gh workflow run / createWorkflowDispatch)
    Node color:  entry trigger - manual / scheduled / push / agentic workflow (.lock.yml)
  -->
  <script type="application/dot" id="dot-source">
digraph workflows {
  rankdir = LR;
  node [shape=box, style="rounded,filled", fillcolor="#eef3fb", color="#5b7fb0", fontname="Helvetica", fontsize=11];
  edge [color="#555555", fontname="Helvetica", fontsize=9];

  "coz3-benchmark-runner" [label="coz3-benchmark-runner", fillcolor="#eef3fb"];
  "coz3-benchmark-sourcer" [label="coz3-benchmark-sourcer", fillcolor="#eef3fb"];
  "coz3-deepfix" [label="coz3-deepfix\n(agentic workflow)", fillcolor="#f3e8fd"];
  "coz3-deepfix-dispatcher" [label="coz3-deepfix-dispatcher", fillcolor="#eef3fb"];
  "coz3-deepscan-dispatcher" [label="coz3-deepscan-dispatcher", fillcolor="#eef3fb"];
  "coz3-deepunknown" [label="coz3-deepunknown\n(agentic workflow)", fillcolor="#f3e8fd"];
  "coz3-deepunknown-dispatcher" [label="coz3-deepunknown-dispatcher", fillcolor="#eef3fb"];
  "coz3-miner-on-benchmark-complete" [label="coz3-miner-on-benchmark-complete", fillcolor="#eef3fb"];
  "coz3-run-miner" [label="coz3-run-miner", fillcolor="#eef3fb"];
  "coz3-snapshot" [label="coz3-snapshot", fillcolor="#eef3fb"];
  "daily-repo-status" [label="daily-repo-status\n(agentic workflow)", fillcolor="#f3e8fd"];
  "deepscan-benchmark" [label="deepscan-benchmark\n(agentic workflow)", fillcolor="#f3e8fd"];
  "fixer-selftest" [label="fixer-selftest\n(agentic workflow)", fillcolor="#f3e8fd"];
  "mariposa-instability-summary" [label="mariposa-instability-summary", fillcolor="#eef3fb"];
  "param-sweep" [label="param-sweep", fillcolor="#eef3fb"];
  "pgo-z3" [label="pgo-z3", fillcolor="#eef3fb"];
  "profile" [label="profile", fillcolor="#eef3fb"];
  "ramon" [label="ramon", fillcolor="#eef3fb"];
  "ramon-ariparti" [label="ramon-ariparti", fillcolor="#eef3fb"];
  "ramon-ariparti-z3" [label="ramon-ariparti-z3", fillcolor="#eef3fb"];
  "ramon-cvc5" [label="ramon-cvc5", fillcolor="#eef3fb"];
  "ramon-log-triage" [label="ramon-log-triage", fillcolor="#eef3fb"];
  "ramon-opensmt" [label="ramon-opensmt", fillcolor="#eef3fb"];
  "ramon-smts" [label="ramon-smts", fillcolor="#eef3fb"];
  "snapshot-regression" [label="snapshot-regression", fillcolor="#eef3fb"];
  "snapshot-regression-fixer" [label="snapshot-regression-fixer\n(agentic workflow)", fillcolor="#f3e8fd"];
  "snapshot-regression-fixer-dispatcher" [label="snapshot-regression-fixer-dispatcher", fillcolor="#eef3fb"];
  "test-z3" [label="test-z3", fillcolor="#eef3fb"];
  "update-compare-html" [label="update-compare-html", fillcolor="#eef3fb"];
  "update-coz3-pages" [label="update-coz3-pages", fillcolor="#eef3fb"];
  "update-workflows-graph" [label="update-workflows-graph\n(agentic workflow)", fillcolor="#f3e8fd"];

  "coz3-benchmark-runner" -> "coz3-deepfix-dispatcher" [style=dashed, label="dispatch"];
  "coz3-benchmark-runner" -> "coz3-run-miner" [style=dashed, label="dispatch"];
  "coz3-benchmark-runner" -> "ramon" [style=dashed, label="dispatch"];
  "coz3-miner-on-benchmark-complete" -> "coz3-run-miner" [style=dashed, label="dispatch"];
  "coz3-miner-on-benchmark-complete" -> "ramon" [style=dashed, label="dispatch"];
  "coz3-run-miner" -> "coz3-deepfix-dispatcher" [style=solid, label="workflow_run"];
  "coz3-run-miner" -> "coz3-deepscan-dispatcher" [style=solid, label="workflow_run"];
  "coz3-run-miner" -> "coz3-deepunknown-dispatcher" [style=solid, label="workflow_run"];
  "ramon" -> "coz3-miner-on-benchmark-complete" [style=solid, label="workflow_run"];
  "snapshot-regression" -> "snapshot-regression-fixer-dispatcher" [style=solid, label="workflow_run"];
}
  </script>

  <script type="module">
    const statusEl = document.getElementById('status');
    const dot = document.getElementById('dot-source').textContent;
    // All @msagl packages must share one @msagl/core instance: keep the same
    // esm.sh target so the renderer's transitive core import and the parser's
    // core import resolve to the identical build. panzoom is externalized here
    // and redirected to a working ESM build via the import map in <head>.
    const RENDERER_URL = 'https://esm.sh/@msagl/renderer-svg@1.1.26?external=panzoom&target=es2022';
    const PARSER_URL = 'https://esm.sh/@msagl/parser@1.1.24?target=es2022';

    try {
      const [{ RendererSvg }, { parseDot }] = await Promise.all([
        import(RENDERER_URL),
        import(PARSER_URL),
      ]);

      const graph = parseDot(dot);
      const renderer = new RendererSvg(document.getElementById('viewer'));
      renderer.layoutEditingEnabled = false;
      renderer.setGraph(graph);
      statusEl.style.display = 'none';
    } catch (err) {
      console.error(err);
      statusEl.className = 'error';
      statusEl.innerHTML =
        'Could not load the interactive graph (msagl-js failed to load).<br>' +
        'See <code>.github/workflows/workflows-graph.dot</code> for the source. <br>' +
        '<small>' + (err && err.message ? err.message : err) + '</small>';
    }
  </script>
</body>

</html>
