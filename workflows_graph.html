<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoZ3 &middot; Workflows Graph</title>

  <!-- msagl-js vendored as an IIFE bundle (assets/msagl-bundle.js).
       Exposes window.msaglBundle = { RendererSvg, parseDot }. -->
  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
      color: #1e2128;
      background: #fffdf8;
    }
    :root {
      --bar-height: 76px;
      --viewer-width: 96vw;
      --viewer-max-width: 1800px;
    }

    #bar {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
      padding: 8px 14px;
      border-bottom: 1px solid #d8d2c7;
      background: #f0ebe1;
      font-size: 0.82rem;
    }

    #bar strong { font-size: 0.92rem; color: #1c3856; }

    .legend { display: inline-flex; align-items: center; gap: 6px; color: #5e6673; }
    .swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid #999; }
    .ln { display: inline-block; width: 22px; border-top: 2px solid #444; }
    .ln.dashed { border-top-style: dashed; }

    #wrap { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }
    #viewer-host { position: relative; flex: 1; min-height: 0; display: flex; align-items: stretch; justify-content: center; padding: 12px; overflow: auto; }
    #viewer-panel {
      position: relative;
      width: min(var(--viewer-width), var(--viewer-max-width));
      height: calc(100vh - var(--bar-height));
      min-width: 520px;
      min-height: 320px;
      resize: both;
      overflow: hidden;
      border: 1px solid #d8d2c7;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }

    #viewer {
      position: absolute;
      inset: 0;
      margin-top: 0;
      touch-action: none;
      overflow: hidden;
    }

    #status {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #5e6673;
      font-size: 0.95rem;
      text-align: center;
      max-width: 80%;
    }

    #status.error { color: #c0392b; }
  </style>
</head>

<body>
  <div id="wrap">
    <div id="bar">
      <strong>Z3Prover/bench &middot; workflow dependency graph</strong>
      <span class="legend"><span class="ln"></span> workflow_run (auto)</span>
      <span class="legend"><span class="ln dashed"></span> explicit dispatch</span>
      <span class="legend"><span class="swatch" style="background:#eef3fb"></span> manual</span>
      <span class="legend"><span class="swatch" style="background:#fff2cc"></span> scheduled</span>
      <span class="legend"><span class="swatch" style="background:#e6f4ea"></span> push</span>
      <span class="legend"><span class="swatch" style="background:#f3e8fd"></span> agentic workflow (.lock.yml)</span>
      <span class="legend" style="color:#999">scroll to zoom &middot; drag to pan</span>
    </div>
    <div id="viewer-host">
      <div id="viewer-panel">
        <div id="viewer"></div>
        <div id="status">Loading msagl-js&hellip;</div>
      </div>
    </div>
  </div>

  <!--
    Dependency graph rendered with msagl-js (https://microsoft.github.io/msagljs/).
    The DOT source below mirrors .github/workflows/workflows-graph.dot. Keep the
    two in sync when workflow triggers change.

    Edge style:  solid = "workflow_run: completed" (event-driven, automatic)
                 dashed = explicit dispatch (gh workflow run / createWorkflowDispatch)
    Node color:  entry trigger - manual / scheduled / push / agentic workflow (.lock.yml)
  -->
  <script type="application/dot" id="dot-source">
digraph workflows {
  rankdir = LR;
  node [shape=box, style="rounded,filled", fillcolor="#eef3fb", color="#5b7fb0", fontname="Helvetica", fontsize=11];
  edge [color="#555555", fontname="Helvetica", fontsize=9];

  "coz3-benchmark-runner" [label="coz3-benchmark-runner", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "coz3-benchmark-sourcer" [label="coz3-benchmark-sourcer", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "coz3-deepfix" [label="coz3-deepfix", style="rounded,filled", color="#5b7fb0", fillcolor="#f3e8fd"];
  "coz3-deepfix-dispatcher" [label="coz3-deepfix-dispatcher", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "coz3-deepscan-dispatcher" [label="coz3-deepscan-dispatcher", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "coz3-deepunknown" [label="coz3-deepunknown", style="rounded,filled", color="#5b7fb0", fillcolor="#f3e8fd"];
  "coz3-deepunknown-dispatcher" [label="coz3-deepunknown-dispatcher", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "coz3-miner-on-benchmark-complete" [label="coz3-miner-on-benchmark-complete", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "coz3-run-miner" [label="coz3-run-miner", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "coz3-snapshot" [label="coz3-snapshot", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "daily-repo-status" [label="daily-repo-status", style="rounded,filled", color="#5b7fb0", fillcolor="#f3e8fd"];
  "deepscan-benchmark" [label="deepscan-benchmark", style="rounded,filled", color="#5b7fb0", fillcolor="#f3e8fd"];
  "fixer-selftest" [label="fixer-selftest", style="rounded,filled", color="#5b7fb0", fillcolor="#f3e8fd"];
  "mariposa-instability-summary" [label="mariposa-instability-summary", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "param-sweep" [label="param-sweep", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "pgo-z3" [label="pgo-z3", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "profile" [label="profile", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "ramon" [label="ramon", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "ramon-ariparti" [label="ramon-ariparti", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "ramon-ariparti-z3" [label="ramon-ariparti-z3", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "ramon-cvc5" [label="ramon-cvc5", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "ramon-log-triage" [label="ramon-log-triage", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "ramon-opensmt" [label="ramon-opensmt", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "ramon-smts" [label="ramon-smts", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "snapshot-regression" [label="snapshot-regression", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "snapshot-regression-fixer" [label="snapshot-regression-fixer", style="rounded,filled", color="#5b7fb0", fillcolor="#f3e8fd"];
  "snapshot-regression-fixer-dispatcher" [label="snapshot-regression-fixer-dispatcher", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "test-z3" [label="test-z3", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "update-compare-html" [label="update-compare-html", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "update-coz3-pages" [label="update-coz3-pages", style="rounded,filled", color="#5b7fb0", fillcolor="#eef3fb"];
  "update-workflows-graph" [label="update-workflows-graph", style="rounded,filled", color="#5b7fb0", fillcolor="#f3e8fd"];

  "coz3-benchmark-runner" -> "coz3-deepfix-dispatcher" [style=dashed, label="dispatch"];
  "coz3-benchmark-runner" -> "coz3-run-miner" [style=dashed, label="dispatch"];
  "coz3-benchmark-runner" -> "ramon" [style=dashed, label="dispatch"];
  "coz3-deepfix-dispatcher" -> "coz3-deepfix" [style=dashed, label="dispatch"];
  "coz3-deepscan-dispatcher" -> "deepscan-benchmark" [style=dashed, label="dispatch"];
  "coz3-deepunknown-dispatcher" -> "coz3-deepunknown" [style=dashed, label="dispatch"];
  "coz3-miner-on-benchmark-complete" -> "coz3-run-miner" [style=dashed, label="dispatch"];
  "coz3-miner-on-benchmark-complete" -> "ramon" [style=dashed, label="dispatch"];
  "coz3-run-miner" -> "coz3-deepfix-dispatcher" [style=solid, label="workflow_run"];
  "coz3-run-miner" -> "coz3-deepscan-dispatcher" [style=solid, label="workflow_run"];
  "coz3-run-miner" -> "coz3-deepunknown-dispatcher" [style=solid, label="workflow_run"];
  "ramon" -> "coz3-miner-on-benchmark-complete" [style=solid, label="workflow_run"];
  "snapshot-regression" -> "snapshot-regression-fixer-dispatcher" [style=solid, label="workflow_run"];
  "snapshot-regression-fixer-dispatcher" -> "snapshot-regression-fixer" [style=dashed, label="dispatch"];
}
  </script>

  <script src="assets/msagl-bundle.js"></script>
  <script>
    (function () {
      const statusEl = document.getElementById('status');
      const dot = document.getElementById('dot-source').textContent;

      try {
        const { RendererSvg, parseDot } = window.msaglBundle;

        const graph = parseDot(dot);
        const viewerEl = document.getElementById('viewer');
        const renderer = new RendererSvg(viewerEl);
        renderer.layoutEditingEnabled = false;
        renderer.setGraph(graph);
        statusEl.style.display = 'none';
      } catch (err) {
        console.error(err);
        statusEl.className = 'error';
        statusEl.innerHTML =
          'Could not load the interactive graph (msagl-js failed to load).<br>' +
          'See <code>.github/workflows/workflows-graph.dot</code> for the source. <br>' +
          '<small>' + (err?.message || (err && err.toString()) || 'Unknown error') + '</small>';
      }
    })();
  </script>
</body>

</html>
